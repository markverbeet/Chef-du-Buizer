<style>
/* Layout: one column phone app, sticky header, fixed bottom tab bar; Delft-blauw als accent */

.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent)}
.why{margin:0;font-size:.92rem;color:var(--muted)}
a{color:var(--accent);font-weight:600}
button.small{min-height:34px;padding:4px 12px;font-size:.85rem}
.day.no{border-color:var(--danger);box-shadow:inset 4px 0 0 var(--danger)}
.pill.no{background:var(--danger-soft);color:var(--danger)}
.mealrow{display:flex;align-items:center;gap:10px}
.mealbtn{flex:1;min-width:0;border:0;background:transparent;padding:0;border-radius:8px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-weight:400}
.mealbtn .sub{text-decoration:underline;text-underline-offset:3px}
.mealrow .meal.empty{flex:1}
.yn{display:flex;gap:8px;flex:none}
.yn button{width:48px;height:48px;min-height:48px;padding:0;border-radius:50%;display:grid;place-items:center;border-width:2px}
.yn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.yn .yes{color:var(--ok);border-color:var(--ok)}

.day.ok .yn .no{opacity:.35;filter:blur(1.2px) grayscale(.6);border-width:1.5px}

.ings{margin:0;padding-left:20px;font-size:.95rem}

<script>
(function(){
const DAYS = 5;
const KT = [["snel","Snel","tot 20 minuten"],["medium","Medium","20 tot 45 minuten"],["lang","Lang","meer dan 45 minuten"]];
const KTL = {snel:"Snel",medium:"Medium",lang:"Lang"};
const FLAGS = [["kind","Kindvriendelijk"],["peul","Bevat peulvruchten"],["vries","Invriesbaar"]];
function propCols(m){

  return `<span class="cols" role="img" aria-label="${sr||"geen kenmerken"}">${cells.map(c=>`<span>${c}</span>`).join("")}</span>`;

function flagTags(m){return FLAGS.filter(([k])=>m[k]).map(([,l])=>`<span class="tag flag">${l}</span>`).join(" ")}

let db=null, user=null, uid=null, canWrite=true;
const meals = new Map();   // id -> {name, ingredients[], note}
const plan = new Map();    // yyyy-mm-dd -> {mealId, mealName, status, by, at}
let mealsLoaded=false, planLoaded=false, live=false;
let delConfirm = null, undoConfirm = null; // undoConfirm: {k, next}
let view = "week", editing = null, mealQuery = "", confirmDelete = false;
const names = {};

function pad(n){return String(n).padStart(2,"0")}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function windowDays(){const out=[];const t=new Date();t.setHours(12,0,0,0);for(let i=0;i<DAYS;i++){const d=new Date(t);d.setDate(t.getDate()+i);out.push(d)}return out}
function dayLabel(d,i){return (i===0?"<b>Vandaag</b> · ":i===1?"<b>Morgen</b> · ":"")+WD[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function sortedMeals(){return [...meals.entries()].sort((a,b)=>a[1].name.localeCompare(b[1].name,"nl"))}
function mealName(p){if(!p)return "";if(p.mealId===null)return p.mealName||"Vrij / uit eten";const m=meals.get(p.mealId);return m?m.name:(p.mealName||"Onbekend gerecht")}

async function resolveNames(ids){
  if(!user||!user.profiles)return;
  const need=ids.filter(id=>id&&!(id in names));if(!need.length)return;
  try{const ps=await user.profiles(need);for(const id of need){names[id]=(ps&&ps[id]&&ps[id].name)||""}render()}catch(e){}
}

// Kies een gerecht: niet al in de planning van deze dagen, voorkeur voor lang niet gegeten
function pickMeal(dateKey, excludeIds){
  const all=[...meals.keys()];if(!all.length)return null;
  let pool=all.filter(id=>!excludeIds.has(id));if(!pool.length)pool=all;
  const target=new Date(dateKey+"T12:00:00");
  const weights=pool.map(id=>{
    let last=null;
    for(const [k,p] of plan){if(p.mealId===id&&k<dateKey&&p.status==="ok"&&(!last||k>last))last=k}
    const days=last?Math.round((target-new Date(last+"T12:00:00"))/864e5):30;
    return Math.max(1,Math.min(days,30))**1.5;
  });
  let r=Math.random()*weights.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
  return pool[pool.length-1];
}
function usedInWindow(exceptKey){const s=new Set();for(const d of windowDays()){const k=key(d);if(k===exceptKey)continue;const p=plan.get(k);if(p&&p.mealId)s.add(p.mealId)}return s}

let busy=false;
async function guard(fn){if(busy||!db)return;busy=true;render();try{await fn()}catch(e){
  if(e&&(e.code==="invalid_argument"||e.code==="permission-denied")){canWrite=false;toast("Je kunt hier alleen meekijken. Vraag om bewerkrechten.")}
  else if(e&&e.code==="quota_exceeded")toast("De opslag is vol. Verwijder oude gerechten.");
  else toast("Opslaan lukte niet. Probeer het nog eens.");
}finally{busy=false;render()}}

function propose(k){return guard(async()=>{
  const id=pickMeal(k,usedInWindow(k));if(!id)return;
  const cur=plan.get(k);
  if(cur&&cur.mealId===id&&meals.size>1){const alt=pickMeal(k,new Set([...usedInWindow(k),id]));if(alt)return setPlan(k,alt,"voorstel")}
  await setPlan(k,id,"voorstel");
})}
async function setPlan(k,mealId,status){
  const body={mealId,mealName:mealId===null?"Vrij / uit eten":(meals.get(mealId)?.name||""),status,by:uid||"",at:Date.now()};
  await writePlan(k,body);
}
async function writePlan(k,body){plan.set(k,body);delete inspo[k];render();await db.doc("plan/"+k).set(body)}

// Inspiratie: een nieuw gerecht dat past bij jullie smaak (Claude, op verzoek)
const inspo={}; // dateKey -> {loading, idea, error}
let sample=null;
function searchUrl(q){return "https://www.google.com/search?q="+encodeURIComponent(q+" recept")}
async function inspire(k){
  if(!sample||(inspo[k]&&inspo[k].loading))return;
  inspo[k]={loading:true};render();
  const favs=sortedMeals().map(([,m])=>"- "+m.name+(m.ingredients.length?" ("+m.ingredients.slice(0,8).join(", ")+")":"")).join("\n");
  const prev=inspo._seen||[];
  const d=new Date(k+"T12:00:00");
  const prompt=`Je helpt een Nederlands huishouden met avondeten. Dit zijn hun favoriete gerechten:\n${favs.slice(0,6000)}\n\n`+
    `Stel één ander avondgerecht voor (${["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"][d.getDay()]}) dat zij waarschijnlijk lekker vinden op basis van deze smaak, maar dat nog niet in de lijst staat. Het moet thuis te koken zijn met ingrediënten uit een gewone Nederlandse supermarkt.`+
    (prev.length?` Noem niet: ${prev.join(", ")}.`:"")+
    `\n\nAntwoord alleen met JSON in deze vorm: {"naam": "...", "waarom": "één korte zin waarom het bij hen past", "ingredienten": ["...", "..."], "kooktijd": "snel" of "medium" of "lang", "zoekterm": "zoekterm om het recept online te vinden"}`;
  try{
    const r=await sample.json(prompt,{cache:false});
    if(!r||!r.naam)throw {code:"invalid_json"};
    const idea={name:String(r.naam).slice(0,80),why:String(r.waarom||"").slice(0,200),ingredients:Array.isArray(r.ingredienten)?r.ingredienten.map(String).slice(0,25):[],search:String(r.zoekterm||r.naam).slice(0,100),kooktijd:KTL[r.kooktijd]?String(r.kooktijd):""};
    inspo._seen=[...prev,idea.name].slice(-10);
    inspo[k]={idea};
  }catch(e){
    const c=e&&e.code;
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){sample=null;delete inspo[k];toast("Inspiratie is niet beschikbaar.")}
    else inspo[k]={error:c==="rate_limited"?"Even te veel verzoeken. Probeer het straks opnieuw.":"Er kwam geen bruikbaar idee terug. Probeer het nog eens."};
  }
  render();
}
function takeIdea(k,save){const it=inspo[k]&&inspo[k].idea;if(!it)return;return guard(async()=>{
  let mealId=null;
  if(save){const ref=await db.collection("meals").add({name:it.name,ingredients:it.ingredients,note:it.why,kooktijd:it.kooktijd,createdAt:Date.now()});mealId=ref.id;meals.set(mealId,{name:it.name,ingredients:it.ingredients,note:it.why,kooktijd:it.kooktijd})}
  await writePlan(k,mealId?{mealId,mealName:it.name,status:"ok",by:uid||"",at:Date.now()}
    :{mealId:null,kind:"inspiratie",mealName:it.name,ingredients:it.ingredients,why:it.why,search:it.search,kooktijd:it.kooktijd,status:"ok",by:uid||"",at:Date.now()});
  toast("Bevestigd en toegevoegd aan Gerechten");
})}
function saveInspired(k){const p=plan.get(k);if(!p||p.kind!=="inspiratie")return;return guard(async()=>{
  const ing=Array.isArray(p.ingredients)?p.ingredients:[];
  const ref=await db.collection("meals").add({name:p.mealName,ingredients:ing,note:p.why||"",kooktijd:p.kooktijd||"",createdAt:Date.now()});
  meals.set(ref.id,{name:p.mealName,ingredients:ing,note:p.why||"",kooktijd:p.kooktijd||""});
  await writePlan(k,{mealId:ref.id,mealName:p.mealName,status:p.status,by:uid||"",at:Date.now()});
  toast("Bewaard bij gerechten");
})}
function inspoBox(k){
  const s=inspo[k];if(!s)return "";
  if(s.loading)return `<div class="inspo"><p class="notice">Claude zoekt een gerecht dat bij jullie past…</p></div>`;
  if(s.error)return `<div class="inspo"><p class="notice">${esc(s.error)}</p><div class="actions"><button data-act="inspire" data-k="${k}">Opnieuw</button><button class="ghost" data-act="inspoclose" data-k="${k}">Sluiten</button></div></div>`;
  const it=s.idea;
  return `<div class="inspo"><span class="eyebrow">Inspiratie</span><p class="meal">${esc(it.name)}</p>${it.why?`<p class="why">${esc(it.why)}</p>`:""}<span class="sub">Kies je deze, dan komt hij ook bij Gerechten.</span>
    ${it.ingredients.length?`<details><summary>${it.ingredients.length} ingrediënten</summary><ul>${it.ingredients.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`:""}
    <a href="${esc(searchUrl(it.search))}" target="_blank" rel="noopener">Zoek het recept online ↗</a>
    <div class="actions"><button class="primary" data-act="takesave" data-k="${k}" ${busy?"disabled":""}>Kies deze</button><button data-act="inspire" data-k="${k}">Ander idee</button><button class="ghost" data-act="inspoclose" data-k="${k}">Terug</button></div></div>`;
}
const ingOpen=new Set(), selfMode=new Set();
let planFor=null; // dag waarvoor het formulier een nieuw gerecht invult
let autoBusy=false;
async function autoFill(){
  if(autoBusy||!db||!canWrite||!meals.size||!mealsLoaded||!planLoaded)return;
  const missing=windowDays().map(key).filter(k=>!plan.get(k));if(!missing.length)return;
  autoBusy=true;
  try{for(const k of missing){
    const snap=await db.doc("plan/"+k).get();
    if(snap.exists){plan.set(k,snap.data());continue}
    const id=pickMeal(k,usedInWindow(k));if(id)await setPlan(k,id,"voorstel");
  }}catch(e){}finally{autoBusy=false;render()}
}
function lastEaten(mealId,before){let last=null;for(const [k,p] of plan){if(p.mealId===mealId&&p.status==="ok"&&k<before&&(!last||k>last))last=k}return last}
function mealDetails(k,p,m){
  const ings=m.ingredients||[];const kt=KT.find(x=>x[0]===m.kooktijd);
  const last=p.mealId?lastEaten(p.mealId,k):null;
  const rows=[];
  rows.push(`<div><dt>Kooktijd</dt><dd>${kt?`<span class="tag kt-${kt[0]}">${kt[1]}</span> ${kt[2]}`:'<span class="muted">Niet ingevuld</span>'}</dd></div>`);
  rows.push(`<div class="span2"><dt>Kenmerken</dt><dd>${FLAGS.map(([k,l])=>`<span class="tag flag${m[k]?"":" off"}">${m[k]?"✓":"✗"} ${l}</span>`).join(" ")}</dd></div>`);
  rows.push(`<div><dt>Laatst gegeten</dt><dd>${last?esc(planLabel(last)):'<span class="muted">Nog niet in de planning</span>'}</dd></div>`);
  return `<div class="details">
    <dl>${rows.join("")}</dl>
    <div><span class="eyebrow">Ingrediënten${ings.length?` (${ings.length})`:""}</span>${ings.length?`<ul class="ings">${ings.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:'<p class="notice">Geen ingrediënten ingevuld.</p>'}</div>
    ${m.note?`<div><span class="eyebrow">Notitie</span><p class="why">${esc(m.note)}</p></div>`:""}
    <div class="actions"><a class="linkbtn" href="${esc(searchUrl(p.search||mealName(p)))}" target="_blank" rel="noopener">Recept zoeken ↗</a>${p.mealId&&canWrite&&meals.has(p.mealId)?`<button class="small" data-act="editmeal" data-id="${esc(p.mealId)}">Gerecht bewerken</button>`:""}</div>
  </div>`;
}
const MONTHS_FULL=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
function cutoffKey(){const d=new Date();d.setHours(12,0,0,0);d.setFullYear(d.getFullYear()-1);return key(d)}
function renderLog(el){
  const today=key(new Date()),cut=cutoffKey();
  const rows=[...plan.entries()].filter(([k,p])=>k<=today&&k>=cut&&p.status==="ok").sort((a,b)=>b[0].localeCompare(a[0]));
  const eaten=rows.filter(([,p])=>p.kind!=="elders");
  const counts=new Map();for(const [,p] of eaten){const n=mealName(p);counts.set(n,(counts.get(n)||0)+1)}
  const top=[...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"nl")).slice(0,5);
  let html=`<div class="row spread"><h2>Logboek</h2><span class="sub">Laatste 12 maanden</span></div>`;
  if(!rows.length){el.innerHTML=html+'<div class="empty-state"><p>Nog niets vastgelegd. Elke bevestigde dag komt hier vanzelf in, ook "we eten elders". Vandaag staat er al in zodra je hem bevestigt.</p></div>';return}
  const away=rows.length-eaten.length;
  html+=`<div class="stats"><div><b>${eaten.length}</b><span>keer thuis gegeten</span></div><div><b>${away}</b><span>keer elders</span></div><div><b>${counts.size}</b><span>verschillende gerechten</span></div></div>`;
  if(top.length)html+=`<div><span class="eyebrow">Meest gegeten</span><ol class="top">${top.map(([n,c])=>`<li><span>${esc(n)}</span><span class="count">${c}×</span></li>`).join("")}</ol></div>`;
  let month="";html+='<div class="loglist">';
  for(const [k,p] of rows){
    const d=new Date(k+"T12:00:00");const mk=MONTHS_FULL[d.getMonth()]+" "+d.getFullYear();
    if(mk!==month){if(month)html+="</div>";month=mk;html+=`<h3 class="month">${mk}</h3><div class="list">`}
    const el2=p.kind==="elders";
    html+=`<div class="logrow${el2?" away":""}"><span class="logdate">${WD[d.getDay()]} ${d.getDate()}</span><span class="logmeal">${el2?"We aten elders":esc(mealName(p))}</span>${k===today?'<span class="tag">vandaag</span>':""}</div>`;
  }
  html+="</div></div>";
  html+=exportBar("log");
  html+='<div><button class="signout" data-act="signout">Uitloggen</button></div>';
  el.innerHTML=html;
}
// Ouder dan 12 maanden opruimen (één keer per bezoek, alleen wie mag schrijven)
let pruned=false;
async function prune(){
  if(pruned||!db||!canWrite||!planLoaded)return;pruned=true;
  const cut=cutoffKey();
  for(const k of [...plan.keys()].filter(k=>k<cut).slice(0,100)){try{await db.doc("plan/"+k).delete()}catch(e){break}}
}
// Export naar XML
let downloads=null;
function xe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]))}
function stamp(){const d=new Date();return key(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function mealsXml(){
  const out=['<?xml version="1.0" encoding="UTF-8"?>',`<chefDuBuizer export="${stamp()}">`,`  <gerechten aantal="${meals.size}">`];
  for(const [id,m] of sortedMeals()){
    out.push(`    <gerecht id="${xe(id)}">`,`      <naam>${xe(m.name)}</naam>`,`      <kooktijd>${xe(m.kooktijd)}</kooktijd>`,...FLAGS.map(([k,l])=>`      <${{kind:"kindvriendelijk",peul:"peulvruchten",vries:"invriesbaar"}[k]}>${m[k]?"ja":"nee"}</${{kind:"kindvriendelijk",peul:"peulvruchten",vries:"invriesbaar"}[k]}>`));
    if(m.note)out.push(`      <notitie>${xe(m.note)}</notitie>`);
    out.push(`      <ingredienten>`,...m.ingredients.map(i=>`        <ingredient>${xe(i)}</ingredient>`),`      </ingredienten>`,`    </gerecht>`);
  }
  out.push("  </gerechten>","</chefDuBuizer>");return out.join("\n");
}
function logXml(){
  const today=key(new Date()),cut=cutoffKey();
  const rows=[...plan.entries()].filter(([k,p])=>k<=today&&k>=cut&&p.status==="ok").sort((a,b)=>a[0].localeCompare(b[0]));
  const out=['<?xml version="1.0" encoding="UTF-8"?>',`<chefDuBuizer export="${stamp()}">`,`  <logboek van="${cut}" tot="${today}" aantal="${rows.length}">`];
  for(const [k,p] of rows){
    const d=new Date(k+"T12:00:00");const away=p.kind==="elders";
    const m=p.mealId?meals.get(p.mealId):null;
    out.push(`    <dag datum="${k}" weekdag="${WD[d.getDay()]}"${away?' elders="ja"':""}>`);
    if(!away){out.push(`      <gerecht>${xe(mealName(p))}</gerecht>`);if(m&&m.kooktijd)out.push(`      <kooktijd>${xe(m.kooktijd)}</kooktijd>`)}
    if(p.by&&names[p.by])out.push(`      <bevestigdDoor>${xe(names[p.by])}</bevestigdDoor>`);
    out.push("    </dag>");
  }
  out.push("  </logboek>","</chefDuBuizer>");return out.join("\n");
}
function exportBar(which){
  return `<div class="exportbar"><span class="eyebrow">Exporteren als XML</span><div class="actions">
    ${downloads?`<button data-act="xmlsave" data-which="${which}">Bewaar als bestand</button>`:""}
    <button data-act="xmlcopy" data-which="${which}">Kopieer XML</button></div>
    <textarea id="xml-${which}" hidden readonly aria-label="XML"></textarea></div>`;
}
async function xmlSave(which){
  const data=which==="meals"?mealsXml():logXml();
  try{await downloads.save({filename:(which==="meals"?"gerechten":"logboek")+"-"+key(new Date())+".xml",data});toast("Bestand opgeslagen")}
  catch(e){const c=e&&e.code;if(c==="declined")return;if(c==="rate_limited")toast("Er staat al een opslagvraag open.");else{downloads=null;render();toast("Opslaan als bestand kan hier niet. Gebruik Kopieer XML.")}}
}
async function xmlCopy(which){
  const data=which==="meals"?mealsXml():logXml();
  try{await navigator.clipboard.writeText(data);toast("XML gekopieerd");return}catch(e){}
  const ta=document.getElementById("xml-"+which);if(ta){ta.hidden=false;ta.value=data;ta.focus();ta.select();toast("Kopiëren lukte niet vanzelf. De XML is geselecteerd.")}
}
function planLabel(k){const d=new Date(k+"T12:00:00");return WD[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]}
function setStatus(k,status){return guard(async()=>{const p=plan.get(k);if(!p)return;await writePlan(k,{...p,status,by:uid||"",at:Date.now()})})}
function saveSelf(k){
  const sel=document.getElementById("self-sel-"+k),val=sel&&sel.value;
  if(!val){toast("Kies een gerecht uit de lijst.");return}
  return guard(async()=>{
    selfMode.delete(k);
    if(val==="__vrij")await writePlan(k,{mealId:null,mealName:"Vrij / uit eten",status:"ok",by:uid||"",at:Date.now()});
    else await writePlan(k,{mealId:val,mealName:meals.get(val)?.name||"",status:"ok",by:uid||"",at:Date.now()});
    toast("Ingevuld en bevestigd");
  });
}

function renderWeek(el){
  const days=windowDays();
  if(!mealsLoaded){el.innerHTML='<p class="notice">Planning laden…</p>';return}
  if(!meals.size){
    el.innerHTML=`<div class="empty-state"><h2>Nog geen gerechten</h2>
      <p>Voeg jullie favoriete gerechten voor het avondeten toe met hun ingrediënten. Daarna krijgt elke dag een voorstel, dat je met een groen vinkje bevestigt of met een rood kruisje afwijst.</p>
      <div class="row"><button class="primary" data-act="newmeal">Eerste gerecht toevoegen</button>${canWrite&&live?'<button data-act="examples">Begin met 8 Hollandse klassiekers</button>':""}</div></div>`;
    return;
  }
  let html=`<h2 class="weekhead">Wat eten we de komende dagen?</h2>`;
  days.forEach((d,i)=>{
    const k=key(d),p=plan.get(k);const st=p?p.status:"";const ok=st==="ok",no=st==="nee";
    if(p&&p.kind==="elders"){
      html+=`<article class="day away"><div class="dayhead"><span class="date">${dayLabel(d,i)}</span></div>

let shopChecked={};try{shopChecked=JSON.parse(localStorage.getItem("mb-shop")||"{}")}catch(e){}
function shopData(){
  const agg=new Map(),days=[];let pending=0;
  windowDays().forEach((d,i)=>{const p=plan.get(key(d));if(!p)return;if(p.status!=="ok"){pending++;return}
    const m=p.mealId?meals.get(p.mealId):p.kind==="inspiratie"?{name:p.mealName,ingredients:Array.isArray(p.ingredients)?p.ingredients.map(String):[]}:null;if(!m)return;
    days.push({label:WD[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()],name:m.name});
    for(const ing of m.ingredients){const k=ing.trim().toLowerCase();if(!k)continue;const e=agg.get(k)||{label:ing.trim(),meals:[]};e.meals.push(m.name);agg.set(k,e)}});
  return {items:[...agg.entries()].sort((a,b)=>a[0].localeCompare(b[0],"nl")),days,pending};
}
function shopText(){
  const {items,days}=shopData();
  const lines=["Boodschappen voor "+days.map(x=>x.label+" ("+x.name+")").join(", "),""];
  for(const [k,e] of items){if(shopChecked[k])continue;lines.push("- "+e.label+(e.meals.length>1?" (×"+e.meals.length+")":""))}
  return lines.join("\n");
}
async function copyShop(){
  const text=shopText();

}

  firebase.initializeApp(FB_CONFIG);
  const fdb=firebase.firestore();
  firebase.auth().getRedirectResult().catch(()=>{});
  firebase.auth().onAuthStateChanged(async u=>{
    unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];
    if(!u){db=null;loginScreen("");return}
    uid=u.uid;db=makeDb(fdb);
    const nameCache={};
    user={id:async()=>uid,can:async()=>true,profiles:async ids=>{const out={};await Promise.all(ids.map(async id=>{if(!(id in nameCache)){try{const x=await fdb.doc("users/"+id).get();nameCache[id]=x.exists?(x.data().name||""):""}catch(e){nameCache[id]=""}}out[id]={name:nameCache[id]}}));return out}};
    try{await fdb.doc("users/"+uid).set({name:(u.displayName||"").split(" ")[0]||u.email,email:u.email||""},{merge:true})}
    catch(e){if(e&&e.code==="permission-denied"){showGate(`<div class="gatebox">${LOGO}<h1>Geen toegang</h1><p>${esc(u.email||"Dit account")} staat niet op de lijst van het huishouden. Vraag de beheerder om je toe te voegen, of log in met een ander account.</p><button id="logoutbtn">Ander account kiezen</button></div>`);document.getElementById("logoutbtn").onclick=()=>firebase.auth().signOut();return}}
    hideGate();live=true;canWrite=true;
    downloads={save:async({filename,data})=>{const url=URL.createObjectURL(new Blob([data],{type:"application/xml"}));const a=document.createElement("a");a.href=url;a.download=filename.replace(/\.txt$/,"");document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return{status:"saved"}}};
    unsubs.push(db.collection("meals").onSnapshot(s=>{meals.clear();for(const d of s.docs){const x=d.data();meals.set(d.id,{name:String(x.name||"Naamloos"),ingredients:Array.isArray(x.ingredients)?x.ingredients.map(String):[],note:String(x.note||""),kooktijd:KTL[x.kooktijd]?String(x.kooktijd):"",kind:x.kind===true,peul:x.peul===true,vries:x.vries===true})}mealsLoaded=true;render();autoFill()},()=>{mealsLoaded=true;render()}));
    unsubs.push(db.collection("plan").onSnapshot(s=>{plan.clear();for(const d of s.docs)plan.set(d.id,d.data());planLoaded=true;render();autoFill();prune();resolveNames([...new Set([...plan.values()].map(p=>p.by))])},()=>{}));
    render();
  });
})();
})();
</script>

</body>
